<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topic 5 Guided Reading #2 (Lessons 5-9)</title>
<style>
:root{color-scheme:light;--navy:#20364d;--blue:#245780;--line:#cbd5df;--paper:#fff;--bg:#f2f5f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1b2936;font:16px/1.55 system-ui,Segoe UI,Arial,sans-serif}
header{background:var(--navy);color:white;padding:16px max(18px,calc((100vw - 1120px)/2));font-size:19px;font-weight:700}
main{max-width:1120px;margin:24px auto;padding:0 16px 42px}h1{font-size:clamp(23px,4vw,32px);line-height:1.2;margin:0 0 8px}h2{font-size:22px;margin:0 0 5px}h3{font-size:17px;margin:16px 0 6px}p{margin:7px 0 12px}
.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:0 3px 12px #20364d0b}
.muted{color:#526477}.small{font-size:13px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}
label{font-weight:650;display:block;margin:10px 0 5px}input,textarea{font:inherit;width:100%;border:1px solid #9aafc1;border-radius:7px;padding:10px 12px;background:white;color:#1b2936}textarea{min-height:105px;resize:vertical;line-height:1.5}
button{font:inherit;font-weight:650;border:1px solid var(--blue);border-radius:7px;padding:10px 16px;background:var(--blue);color:white;cursor:pointer}button.secondary{background:white;color:var(--blue)}button:disabled{opacity:.45;cursor:not-allowed}
.pill{font-size:13px;font-weight:700;color:var(--blue);background:#e8f1f8;border-radius:30px;padding:5px 11px}.progress{height:7px;background:#e0e8ef;border-radius:8px;overflow:hidden;margin:12px 0 20px}.progress>div{height:100%;background:#3677a4}
.workspace{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}.reading,.responses{background:#fbfcfe;border:1px solid var(--line);border-radius:9px;padding:18px;max-height:65vh;overflow:auto}.reading{border-top:4px solid #467ca4}.responses{border-top:4px solid #799b75}.reading p{line-height:1.7}.question{padding:14px 0;border-bottom:1px solid #d9e1e8}.question:first-of-type{padding-top:0}.question:last-child{border:0}.term{font-weight:700;color:var(--blue)}.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}.status{font-size:13px;color:#42604b}.notice{background:#eaf4eb;border-left:4px solid #60916b;padding:12px 16px;border-radius:5px}
.reading,.responses h2,.responses h3,.responses label,.responses p{-webkit-user-select:none;user-select:none}
@media(max-width:780px){.workspace,.fields{grid-template-columns:1fr}.reading,.responses{max-height:none}.panel{padding:16px}}
@media print{header,.nav,button,.noprint{display:none!important}body{background:white}.panel{border:0;box-shadow:none}.reading,.responses{max-height:none;overflow:visible}.workspace{display:block}.reading{margin-bottom:20px}}
</style></head><body><header>World History · Topic 5 Guided Reading #2 (Lessons 5–9)</header><main id="app"></main>
<script>
const DATA={"missions":[{"title":"The Government Debate","sub":"Lesson 5 · Hobbes, Locke and the rights of citizens","passages":[["A frightening world","Thomas Hobbes wrote Leviathan in 1651, during the era of the English Civil War. He feared that without a strong government people would compete, fight, and threaten one another. Hobbes argued that people needed a powerful sovereign to keep order and protect them. In his view, subjects should not casually overthrow the ruler, because rebellion could return society to chaos."],["Government with permission","John Locke took a different approach. Locke argued that people possess natural rights, including life, liberty, and property. Governments receive their authority from the people and should protect those rights. If rulers govern without lawful authority and violate the rights of the people, citizens may resist and replace that government. The English Bill of Rights reflected the broader movement toward limits on royal power."]],"qs":[["Why did Thomas Hobbes believe people needed a strong ruler? Explain what he feared would happen without one.","A strong ruler keeps order; without government, people could fall into violence and chaos."],["What natural rights did John Locke emphasize, and when did he believe people could replace their government?","Life, liberty, property; people can replace a government that violates rights or rules without authority."]],"vocab":[["natural rights","Basic rights people possess, such as life, liberty, and property."],["social contract","An agreement in which people form a government and accept rules in exchange for protection or shared benefits."]]},{"title":"The Observatory","sub":"Lesson 6 · The Scientific Revolution","passages":[["The universe is reconsidered","For centuries, many Europeans accepted a geocentric model in which Earth stood at the center. Nicolaus Copernicus proposed a heliocentric, or sun-centered, model. Johannes Kepler later showed that planets move around the sun in elliptical rather than perfectly circular orbits. These discoveries challenged traditional explanations."],["Evidence changes the argument","Galileo used a telescope to observe mountains on the moon, sunspots, and moons orbiting Jupiter. His findings supported the new astronomy and brought him into conflict with the Catholic Church. Isaac Newton described laws of motion and universal gravitation, helping explain how objects on Earth and bodies in space move. The Scientific Revolution emphasized observation, measurement, mathematics, and experimentation."]],"qs":[["Compare the geocentric and heliocentric models. Who promoted the sun-centered model, and what did Kepler add?","Geocentric = Earth-centered; heliocentric = sun-centered; Copernicus proposed sun-centered model; Kepler found elliptical orbits."],["Identify TWO scientific discoveries or methods associated with Galileo and Newton. Explain why they mattered.","Galileo used telescope observations to challenge old ideas; Newton explained motion and gravity with laws. Both supported evidence-based science."]],"vocab":[["geocentric","Earth-centered model of the universe."],["heliocentric","Sun-centered model in which planets, including Earth, orbit the sun."]]},{"title":"The Gallery of Ideas","sub":"Lesson 7 · European art and literature","passages":[["Art that unsettles and persuades","Mannerism developed after the High Renaissance. Its artists often used elongated figures, unusual proportions, and emotional tension instead of calm balance. Baroque art used dramatic movement, light, detail, and grandeur. Catholic leaders embraced Baroque art to communicate religious feeling and the strength of the Church during the era of religious conflict."],["Writers question the world","William Shakespeare explored ambition, power, loyalty, and human behavior in plays such as Hamlet. Miguel de Cervantes wrote Don Quixote, a novel that contrasts imagined chivalric ideals with ordinary reality. Growing literacy and printing helped more people encounter new stories and ideas."]],"qs":[["How did Mannerism and Baroque art differ from the balanced art of the High Renaissance? Give one characteristic of EACH style.","Mannerism: elongated/distorted figures or tension; Baroque: drama, movement, strong light, grandeur."],["Name ONE major writer from this period and explain what his work revealed or questioned about society.","Shakespeare explored power/human behavior in plays; OR Cervantes used Don Quixote to question heroic ideals and reality."]],"vocab":[["Mannerism","Art style using unusual proportions, elongated figures, and emotional tension."],["Baroque","Dramatic, elaborate style in art and architecture using movement, strong emotion, and grandeur."]]},{"title":"The Salon of Reason","sub":"Lesson 8 · The Enlightenment","passages":[["Reason and government","Enlightenment thinkers, called philosophes, applied reason to human affairs and argued that society could improve. Montesquieu proposed separating legislative, executive, and judicial powers so that no single person or group controlled everything. Voltaire defended religious toleration and criticized intolerance. Denis Diderot edited the Encyclopedia to spread knowledge and encourage reform."],["Rights, society, and markets","Jean-Jacques Rousseau argued that legitimate political authority should reflect the people and their collective will, an idea linked to the social contract. Adam Smith supported laissez-faire economics, in which government generally interferes less in trade and markets. Enlightenment discussions also included arguments about women’s rights and criticism of inherited privilege. Some rulers adopted limited reforms while keeping strong personal power; this is called enlightened absolutism."]],"qs":[["Choose TWO Enlightenment thinkers and explain one important idea associated with EACH.","Examples: Montesquieu—separation of powers; Voltaire—religious toleration; Rousseau—popular sovereignty/social contract; Diderot—Encyclopedia; Adam Smith—laissez-faire."],["How did Enlightenment thinkers challenge traditional political or economic authority? Give TWO examples.","Examples: limit government with separated powers/rights; government based on people; religious toleration; less government control of economy."],["What is laissez-faire, and how did Adam Smith think it would affect the economy?","Laissez-faire = limited government regulation; Smith believed markets and competition could guide economic activity."]],"vocab":[["separation of powers","Dividing government authority among branches so each limits the others."],["laissez-faire","Economic idea that government should generally leave markets and business activity alone."]]},{"title":"The Evidence Chamber","sub":"Lesson 9 · Enlightenment ideas in primary sources","passages":[["Ideas in the documents","Montesquieu’s The Spirit of the Laws warns that liberty is threatened when the same person controls lawmaking, enforcement, and courts. Rousseau’s The Social Contract explores political authority formed through an association of citizens. Locke’s Second Treatise of Government argues against rulers who seize lawmaking authority without the people’s consent."],["Ideas beyond kings","Mary Wollstonecraft argued for greater rights and education for women. Adam Smith’s The Wealth of Nations examined markets and the role of government. Voltaire used satire, including Candide, to criticize accepted beliefs and abuses. Together these sources show that Enlightenment thinkers challenged political, economic, religious, and social assumptions; scientific investigation helped establish the habit of questioning authority through reason and evidence."]],"qs":[["How did Enlightenment writers use books and other sources to challenge traditional authority? Give TWO specific examples from the lesson.","Examples: Montesquieu—separate powers; Locke—consent/rights; Rousseau—citizens’ authority; Wollstonecraft—women’s rights; Smith—markets; Voltaire—satire/toleration."],["Explain ONE connection between the Scientific Revolution and the Enlightenment, and ONE way Enlightenment ideas influenced government or society.","Scientific Revolution modeled reason/evidence; Enlightenment applied reason to society. It promoted rights, limited power, reform, or religious toleration."],["Why did ideas such as natural rights and separation of powers threaten absolute monarchies?","They challenged unlimited royal authority by emphasizing citizens’ rights and limits on government power."]],"vocab":[]}]};
const MISSIONS=DATA.missions, KEY='world-history-topic5-gr2-simple-v1';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allQs=MISSIONS.flatMap(m=>m.qs),allV=MISSIONS.flatMap(m=>m.vocab);
let state={name:'',block:'',started:false,lesson:0,answers:{},vocab:{}};
try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object')state={...state,...saved,answers:saved.answers||{},vocab:saved.vocab||{}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function qOffset(i){return MISSIONS.slice(0,i).reduce((n,m)=>n+m.qs.length,0)}
function vOffset(i){return MISSIONS.slice(0,i).reduce((n,m)=>n+m.vocab.length,0)}
function answered(){return allQs.filter((_,i)=>String(state.answers[i+1]||'').trim()).length+allV.filter((_,i)=>String(state.vocab[i+1]||'').trim()).length}
function draw(){if(!state.started)return home();if(state.lesson<0||state.lesson>=MISSIONS.length)state.lesson=0;lesson()}
function home(){app.innerHTML=`<section class="panel"><h1>Topic 5 Guided Reading #2 (Lessons 5–9)</h1><p class="muted">Scientific Revolution, Enlightenment, and European Culture</p><p>Read each lesson and answer the questions in your own words. Complete all <b>12 questions</b> and <b>8 vocabulary definitions</b>. Use the Previous and Next buttons to move between lessons.</p><p class="notice">Your work saves automatically in this browser on this device. When finished, download your completed Guided Reading and submit the file to Schoology. Downloading does not submit it.</p><div class="fields"><div><label for="name">First and last name</label><input id="name" placeholder="First Last" value="${esc(state.name)}"></div><div><label for="block">Class / Block</label><input id="block" placeholder="WH 2A" value="${esc(state.block)}"></div></div><div class="row"><button id="start">${state.started?'Continue Guided Reading':'Start Guided Reading'} →</button>${answered()?`<span class="status">${answered()} of 20 responses saved</span>`:''}</div></section>`;document.getElementById('start').onclick=()=>{let n=document.getElementById('name').value.trim();if(!n)return alert('Please enter your first and last name.');state.name=n;state.block=document.getElementById('block').value.trim();state.started=true;save();draw()}}
function lesson(){let i=state.lesson,m=MISSIONS[i],q0=qOffset(i),v0=vOffset(i);app.innerHTML=`<section class="panel"><div class="row between"><span class="pill">Lesson ${i+5} of 9</span><span class="status" id="count">${answered()} of 20 responses saved</span></div><div class="progress"><div style="width:${(i+1)*20}%"></div></div><h1>${esc(m.title)}</h1><p class="muted">${esc(m.sub)}</p><p class="small muted">Read the material on the left and write your answers on the right. Both sections scroll independently on a laptop.</p><div class="workspace"><section class="reading"><h2>Reading</h2>${m.passages.map(p=>`<h3>${esc(p[0])}</h3><p>${esc(p[1])}</p>`).join('')}</section><section class="responses"><h2>Questions & Vocabulary</h2><p class="small muted">Answer in your own words. Your responses save as you type.</p>${m.qs.map((q,j)=>{let id=q0+j+1;return `<div class="question"><label for="q${id}">Question ${id}. ${esc(q[0])}</label><textarea id="q${id}" data-q="${id}" placeholder="Type your answer here...">${esc(state.answers[id]||'')}</textarea></div>`}).join('')}${m.vocab.length?`<h3>Vocabulary</h3><p class="small muted">Use the reading and the definition below to explain each term in your own words.</p>${m.vocab.map((v,j)=>{let id=v0+j+1;return `<div class="question"><label for="v${id}"><span class="term">${id}. ${esc(v[0])}</span></label><p class="small muted">${esc(v[1])}</p><textarea id="v${id}" data-v="${id}" placeholder="Write your definition here...">${esc(state.vocab[id]||'')}</textarea></div>`}).join('')}`:''}</section></div><div class="nav"><button class="secondary" id="prev" ${i===0?'disabled':''}>← Previous Lesson</button><div class="row"><button class="secondary" id="download">Download My Work</button><button id="next">${i===4?'Review & Download →':'Next Lesson →'}</button></div></div></section>`;
document.querySelectorAll('[data-q]').forEach(t=>t.oninput=()=>{state.answers[t.dataset.q]=t.value;save();document.getElementById('count').textContent=`${answered()} of 20 responses saved`});
document.querySelectorAll('[data-v]').forEach(t=>t.oninput=()=>{state.vocab[t.dataset.v]=t.value;save();document.getElementById('count').textContent=`${answered()} of 20 responses saved`});
document.getElementById('prev').onclick=()=>{state.lesson--;save();draw();window.scrollTo(0,0)};
document.getElementById('next').onclick=()=>{if(i===4)review();else{state.lesson++;save();draw();window.scrollTo(0,0)}};
document.getElementById('download').onclick=download;
}
function review(){let missing=allQs.map((_,i)=>!String(state.answers[i+1]||'').trim()?'Question '+(i+1):null).concat(allV.map((_,i)=>!String(state.vocab[i+1]||'').trim()?'Vocabulary '+(i+1):null)).filter(Boolean);app.innerHTML=`<section class="panel"><h1>Review & Download</h1><p><b>${esc(state.name)}</b> · ${esc(state.block)}</p><p><b>${answered()} of 20 responses completed</b></p>${missing.length?`<p class="notice"><b>Still missing:</b> ${esc(missing.join(', '))}. You may return to finish these before submitting.</p>`:`<p class="notice">All 12 questions and 8 vocabulary definitions have responses.</p>`}<p>Download your completed Guided Reading, then upload the file to your Schoology assignment.</p><div class="row"><button id="download">Download Completed Guided Reading (.doc)</button><button class="secondary" id="back">← Return to Lessons</button></div><p class="small muted">Your answers remain saved on this device and browser unless browser storage is cleared.</p></section>`;document.getElementById('download').onclick=download;document.getElementById('back').onclick=()=>{draw()}}
function reportHTML(){let qItem=(q,i)=>`<div style="page-break-inside:avoid;margin-bottom:14pt"><b>${i+1}. ${esc(q[0])}</b><p style="white-space:pre-wrap;margin:5pt 0 0 12pt">${esc(state.answers[i+1]||'[No response]')}</p></div>`;let vItem=(v,i)=>`<div style="page-break-inside:avoid;margin-bottom:15pt"><b>${i+1}. ${esc(v[0])}</b><p style="white-space:pre-wrap;margin:5pt 0 0 12pt">${esc(state.vocab[i+1]||'[No response]')}</p></div>`;return `<!doctype html><html><head><meta charset="utf-8"><style>@page{size:letter;margin:.65in}body{font:11pt/1.35 Calibri,Arial,sans-serif;color:#111}h1{font-size:17pt}h2{font-size:14pt;border-bottom:1px solid #888;padding-bottom:5pt}.page{page-break-after:always}</style></head><body><div class="page"><h1>Topic 5 Guided Reading #2 (Lessons 5–9)</h1><p><b>Student:</b> ${esc(state.name)} &nbsp; <b>Class:</b> ${esc(state.block)} &nbsp; <b>Date:</b> ${new Date().toLocaleDateString()}</p><h2>Guided Reading Questions 1–6</h2>${allQs.slice(0,6).map((q,i)=>qItem(q,i)).join('')}</div><div class="page"><h2>Guided Reading Questions 7–12</h2>${allQs.slice(6).map((q,i)=>qItem(q,i+6)).join('')}</div><h2>Vocabulary — Student Definitions</h2>${allV.map((v,i)=>vItem(v,i)).join('')}</body></html>`}
function download(){let blob=new Blob([reportHTML()],{type:'application/msword'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Topic5_GR2_'+(state.name||'Student').replace(/[^a-z0-9]+/gi,'_')+'.doc';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
// Classroom copy/paste safeguards. Students can still type and revise normally.
document.addEventListener('copy', e => e.preventDefault(), true);
document.addEventListener('cut', e => e.preventDefault(), true);
document.addEventListener('paste', e => e.preventDefault(), true);
document.addEventListener('drop', e => { if(e.target.closest('input,textarea,.reading,.responses')) e.preventDefault(); }, true);
document.addEventListener('contextmenu', e => { if(e.target.closest('.reading,.responses,input,textarea')) e.preventDefault(); }, true);
document.addEventListener('keydown', e => {
  const k=e.key.toLowerCase();
  if(((e.ctrlKey||e.metaKey)&&['c','v','x'].includes(k)) || (e.shiftKey&&k==='insert')) e.preventDefault();
}, true);
draw();
</script></body></html>
